<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arshad Ali — Portfolio</title>
<meta name="description" content="Python / Django backend developer portfolio.">
<meta name="keywords" content="Arshad Ali, Python Developer, Django Developer, Backend Engineer">
<meta property="og:title" content="Arshad Ali — Python / Django Backend Developer">
<meta property="og:description" content="Scalable REST APIs, POS platforms and AIoT-integrated backend systems.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23111%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22%23ff7a29%22 font-family=%22monospace%22>A</text></svg>">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="Static/CSS/themes.css">
<link rel="stylesheet" href="Static/CSS/style.css">
<link rel="stylesheet" href="Static/CSS/animations.css">
<link rel="stylesheet" href="Static/CSS/responsive.css">
</head>
<body data-template="default">

<div id="app-root">

  <!-- PRELOADER -->
  <div class="preloader" id="preloader">
    <div class="p-logo mono"><span class="grad-text">arshadali@django</span>:~$ django_portfolio</div>
    <div class="p-bar"><i></i></div>
  </div>

  <div class="scroll-progress" id="scroll-progress"></div>
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <canvas id="particles-canvas"></canvas>
  <div class="grid-overlay"></div>

  <!-- NAVBAR -->
  <nav class="navbar" aria-label="Primary">
    <div class="logo"><span class="dot"></span> Arshad Ali</div>
    <ul class="nav-links" id="nav-links-list"></ul>

    <div class="nav-actions">
      <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle light and dark mode">
        <span class="material-symbols-outlined icon-sun">light_mode</span>
        <span class="material-symbols-outlined icon-moon">dark_mode</span>
      </button>

      <div class="template-select" id="template-select">
        <button class="icon-btn" id="template-btn" aria-label="Choose a visual template">
          <span class="material-symbols-outlined">palette</span>
        </button>
        <div class="template-menu" id="template-menu"></div>
      </div>

      <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="Toggle menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
    </div>
  </nav>

  <main>
    <!-- HOME / HERO -->
    <section id="home" class="hero">
      <div class="container hero-grid">
        <div>
          <div class="hero-eyebrow mono" id="hero-eyebrow">hello():</div>
          <h1 id="hero-name"></h1>
          <div class="hero-role mono">&gt; <span id="hero-role-text"></span><span class="cursor">&nbsp;</span></div>
          <p class="desc" id="hero-desc"></p>
          <div class="btn-row" id="hero-btn-row"></div>
          <div class="hero-stats" id="hero-stats"></div>
        </div>

        <div class="hero-scene-wrap">
          <div id="hero-3d"></div>
          <div class="scene-caption"><span class="dot"></span> rendering Python.Django()</div>
        </div>
      </div>
    </section>

    <!-- EXPERIENCE -->
    <section id="experience" class="section" data-page>
      <div class="container section-inner">
        <div class="eyebrow-code" id="experience-eyebrow"></div>
        <h2 class="section-title" id="experience-title"></h2>
        <p class="section-sub" id="experience-sub"></p>
        <div class="timeline" id="timeline-wrap"></div>
      </div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="section" data-page>
      <div class="container section-inner">
        <div class="eyebrow-code" id="about-eyebrow"></div>
        <h2 class="section-title" id="about-title"></h2>

        <div class="about-grid">
          <div class="about-card" data-reveal>
            <div class="avatar-ring">
              <a href="../Static/Images/Tumbnail_Arshad.png" title="download image">
                <img src="../Static/Images/Tumbnail_Arshad.png" alt="${img.alt}" 
                  style=" width: 100%; height: auto; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.35); transition: 0.3s; display: block; "
                  onmouseover="this.style.transform='scale(1.02)'"  onmouseout="this.style.transform='scale(1)'" />
              </a></div>
            <div class="about-highlights" id="about-highlights"></div>
          </div>

          <div>
            <div class="about-body" id="about-body"></div>
            <div class="about-buttons" id="about-buttons"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- SKILLS -->
    <section id="skills" class="section" data-page>
      <div class="container section-inner">
        <div class="eyebrow-code" id="skills-eyebrow"></div>
        <h2 class="section-title" id="skills-title"></h2>
        <div class="skills-cats" id="skills-cats"></div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="section" data-page>
      <div class="container section-inner">
        <div class="eyebrow-code" id="projects-eyebrow"></div>
        <h2 class="section-title" id="projects-title"></h2>
        <div class="filter-row" id="filter-row"></div>
        <div class="projects-grid" id="projects-grid"></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section" data-page>
      <div class="container section-inner">
        <div class="eyebrow-code" id="contact-eyebrow"></div>
        <h2 class="section-title" id="contact-title"></h2>
        <p class="section-sub" id="contact-sub"></p>

        <div class="contact-grid">
          <div class="contact-list" id="contact-list"></div>

          <div class="contact-panel">
            <div class="terminal-bar"><span></span><span></span><span></span></div>
            <pre id="contact-code"></pre>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-top">
        <div class="footer-quote" id="footer-quote"></div>
        <div class="footer-social" id="footer-social"></div>
      </div>
      <div class="footer-bottom">
        <span id="footer-copy"></span>
        <nav class="footer-nav-links" id="footer-nav" style="display:flex;gap:16px;"></nav>
      </div>
    </div>
  </footer>

  <button class="back-to-top" id="back-to-top" aria-label="Back to top">
    <span class="material-symbols-outlined">arrow_upward</span>
  </button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="Static/JS/data-loader.js"></script>
<script src="Static/JS/renderer.js"></script>
<script src="Static/JS/navigation.js"></script>
<script src="Static/JS/themes.js"></script>
<script src="Static/JS/particles.js"></script>
<script src="Static/JS/three-scene.js"></script>
<script src="Static/JS/animations.js"></script>
<script src="Static/JS/app.js"></script>
</body>
</html>
